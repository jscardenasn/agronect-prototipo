<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Iniciar Sesión - AgroNECT Boyacá</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
          colors: {
            navy: { 950: '#061627', 900: '#0a2540', 850: '#0e3052', 800: '#133e6b', 700: '#1e528d' },
            emerald: { 500: '#10b981', 600: '#16a34a', 700: '#15803d' }
          }
        }
      }
    }
</script>
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .radial-ambient {
      background: radial-gradient(circle 800px at 50% 20%, rgba(16, 185, 129, 0.08), transparent 70%),
                  radial-gradient(circle 600px at 80% 80%, rgba(14, 165, 233, 0.07), transparent 60%),
                  radial-gradient(circle 500px at 20% 70%, rgba(5, 150, 105, 0.06), transparent 50%);
    }
</style>
</head>
<body class="min-h-screen w-full bg-[#0a2540] text-slate-100 flex flex-col justify-between relative overflow-x-hidden antialiased selection:bg-emerald-500 selection:text-white">
<div class="fixed inset-0 pointer-events-none radial-ambient z-0"></div>
<svg class="fixed inset-0 w-full h-full object-cover pointer-events-none z-0 opacity-10" fill="none" preserveaspectratio="none" viewbox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
<defs>
<lineargradient id="terraceGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10B981"></stop><stop offset="100%" stop-color="#38BDF8"></stop></lineargradient>
<lineargradient id="terraceGrad2" x1="100%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#34D399"></stop><stop offset="100%" stop-color="#0284C7"></stop></lineargradient>
</defs>
<path d="M-100 200 C 250 150, 450 320, 800 240 C 1150 160, 1300 280, 1600 220" stroke="url(#terraceGrad1)" stroke-dasharray="8 6" stroke-width="1.7"></path>
<path d="M-100 320 C 300 280, 520 460, 920 380 C 1220 300, 1400 420, 1600 360" stroke="url(#terraceGrad1)" stroke-width="2"></path>
<path d="M-100 450 C 200 410, 480 580, 850 510 C 1200 440, 1350 560, 1600 500" stroke="url(#terraceGrad2)" stroke-width="1.5"></path>
<path d="M-100 580 C 350 520, 600 700, 950 620 C 1250 550, 1420 680, 1600 640" stroke="url(#terraceGrad2)" stroke-dasharray="12 8" stroke-width="2"></path>
<path d="M-100 720 C 280 660, 550 820, 1000 750 C 1300 690, 1480 810, 1600 780" stroke="url(#terraceGrad1)" stroke-width="1.5"></path>
<circle cx="280" cy="285" fill="#10B981" r="4"></circle><circle cx="280" cy="285" opacity="0.6" r="9" stroke="#10B981" stroke-width="1"></circle>
<circle cx="920" cy="380" fill="#38BDF8" r="5"></circle><circle cx="920" cy="380" opacity="0.5" r="11" stroke="#38BDF8" stroke-width="1"></circle>
<circle cx="1220" cy="300" fill="#34D399" r="4"></circle><circle cx="600" cy="700" fill="#10B981" r="4"></circle>
<line opacity="0.4" stroke="#10B981" stroke-dasharray="4 6" stroke-width="0.75" x1="280" x2="920" y1="285" y2="380"></line>
<line opacity="0.4" stroke="#38BDF8" stroke-dasharray="4 6" stroke-width="0.75" x1="920" x2="1220" y1="380" y2="300"></line>
</svg>
<main class="relative z-10 flex-1 w-full flex items-center justify-center px-4 py-8 sm:px-6 lg:px-8">
<div class="w-full max-w-[500px]">
<div class="bg-white rounded-3xl p-8 sm:p-10 shadow-[0_25px_60px_-15px_rgba(0,0,0,0.45)] border border-slate-100/90 text-slate-900 transition-all">
<div class="flex items-center gap-3">
<div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-500 to-emerald-600 flex items-center justify-center text-white shadow-md shadow-emerald-600/20 shrink-0">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M12 22V12"></path>
<path d="M12 12C12 7.5 15.5 4 20 4C20 8.5 16.5 12 12 12Z" fill="currentColor" fill-opacity="0.25"></path>
<path d="M12 15C12 11.5 9 9 5 9C5 12.5 8 15 12 15Z" fill="currentColor" fill-opacity="0.2"></path>
</svg>
</div>
<div>
<div class="flex items-baseline gap-1">
<span class="text-2xl font-extrabold tracking-tight text-[#0a2540]">Agro<span class="text-emerald-600">NECT</span></span>
</div>
<div class="text-[10px] font-bold tracking-[0.18em] uppercase text-emerald-600">Boyacá Conectada</div>
</div>
</div>
<div class="mt-6 mb-7">
<h1 class="text-2xl font-bold tracking-tight text-slate-900">Bienvenido de nuevo</h1>
<p class="text-sm text-slate-500 mt-1.5 leading-relaxed">Accede al ecosistema de precios y comercialización agrícola de Boyacá.</p>
</div>
<!-- Se le agregó un ID al formulario para capturarlo desde JS -->
<form class="space-y-4" id="login-form">
<div>
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 mb-1.5" for="email">Correo electrónico <span class="text-emerald-600">*</span></label>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><span class="material-symbols-outlined text-[20px]">mail</span></div>
<input class="block w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0a2540] focus:border-transparent transition-all" id="email" placeholder="ejemplo@agronect.co" required="" type="email"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1.5">
<label class="block text-xs font-semibold uppercase tracking-wider text-slate-700" for="password">Contraseña <span class="text-emerald-600">*</span></label>
<a onclick="alert('Se ha enviado un enlace de recuperación a tu correo (Simulación).')" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 hover:underline transition-colors cursor-pointer">¿Olvidaste tu contraseña?</a>
</div>
<div class="relative rounded-xl shadow-sm">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400"><span class="material-symbols-outlined text-[20px]">lock</span></div>
<input class="block w-full pl-11 pr-11 py-3 bg-slate-50 border border-slate-200 text-slate-900 text-sm rounded-xl placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#0a2540] focus:border-transparent transition-all" id="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Mostrar u ocultar contraseña" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors cursor-pointer" id="toggle-btn" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="pt-0.5">
<label class="inline-flex items-center gap-2.5 text-sm text-slate-600 cursor-pointer select-none">
<input class="w-4 h-4 rounded text-emerald-600 border-slate-300 focus:ring-emerald-500/20 focus:ring-offset-0 transition-colors cursor-pointer" type="checkbox"/>
<span class="font-medium">Recordar mi sesión</span>
</label>
</div>
<div class="pt-2">
<button class="w-full py-3.5 rounded-xl font-semibold text-white bg-[#0a2540] hover:bg-[#133e6b] active:scale-[0.99] transition-all shadow-md shadow-[#0a2540]/25 flex items-center justify-center gap-2 cursor-pointer" type="submit">
<span>Ingresar</span>
<span class="material-symbols-outlined text-[19px]">arrow_forward</span>
</button>
</div>
<div class="relative py-2 flex items-center">
<div class="flex-grow border-t border-slate-200"></div>
<span class="flex-shrink mx-4 text-xs font-medium uppercase tracking-wider text-slate-400">O continúa con</span>
<div class="flex-grow border-t border-slate-200"></div>
</div>
<!-- Botón de Google con su propia lógica -->
<button onclick="loginConGoogle()" class="w-full py-3 px-4 rounded-xl font-medium text-slate-700 bg-white border border-slate-200 hover:bg-slate-50 hover:border-slate-300 active:scale-[0.99] transition-all flex items-center justify-center gap-3 shadow-xs cursor-pointer" type="button">
<svg class="w-4 h-4" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="text-sm">Continuar con Google</span>
</button>
</form>
<div class="mt-7 text-center text-sm text-slate-500">
¿No tienes una cuenta aún? <a onclick="alert('Módulo de registro en construcción.')" class="text-emerald-600 font-semibold hover:underline ml-1 cursor-pointer">Regístrate aquí</a>
</div>
</div>
</div>
</main>
<footer class="relative z-10 w-full pb-6 pt-2 text-center text-xs tracking-wider font-medium text-slate-300/60 selection:text-white">
<p>AgroNECT Boyacá • Red Departamental de Abastecimiento • Sistema Oficial SIPSA - DANE</p>
</footer>
<script>
    // 1. Lógica para mostrar/ocultar contraseña
    const toggleBtn = document.getElementById('toggle-btn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    // 2. Lógica para Iniciar Sesión Normal
    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault(); // Evitamos que la página recargue
      
      const email = document.getElementById('email').value;
      
      // Guardamos el correo en el navegador (LocalStorage)
      localStorage.setItem('agronect_user', email);
      
      // Redirigimos al catálogo
      window.location.href = 'catalogo.html';
    });

    // 3. Lógica para Iniciar Sesión con Google (Simulado)
    function loginConGoogle() {
      // Simulamos que Google nos devuelve este correo
      const emailGoogle = 'operador.google@agronect.co';
      localStorage.setItem('agronect_user', emailGoogle);
      window.location.href = 'catalogo.html';
    }
</script>
</body>
</html>
